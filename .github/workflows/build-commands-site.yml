name: Publish Commands Site to Public Repo

on:
  push:
    paths:
      - MedlarTV/config/commands.yaml
  workflow_dispatch:

env:
  SITE_REPO: DevilMedlar/medlar-commands-site

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build commands site from YAML
        run: python MedlarTV/tools/build_commands_site.py --out site_docs

      - name: Checkout public site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          path: site
          token: ${{ secrets.SITE_PUSH_TOKEN }}

      - name: Update docs in public site repo
        run: |
          rm -rf site/docs
          mkdir -p site/docs
          cp -r site_docs/* site/docs/

      - name: Commit and push to public site repo
        run: |
          git -C site config user.name github-actions
          git -C site config user.email github-actions@github.com
          git -C site add docs
          if git -C site diff --cached --quiet; then echo "No changes"; else git -C site commit -m "Update commands site" && git -C site push; fi