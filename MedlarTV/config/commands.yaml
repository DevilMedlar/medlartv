commands:
  ping:
    response: "Pong 🏓 — I hear you, {user}!"
  
  status:
    response: "System nominal ⚙️ | Connected as {nick}"
  
  hello:
    response: "Hey {user}! 👋 Ready for action."
  
  hype:
    response: "🔥 LET'S GOOOOO, {user}!"
  
  medlar:
    response: "devilmeGODMODE Medlar mode engaged, {user} 😈"
  
  moodnumbers:
    response: "{user} 📊 Mood breakdown incoming!"
  
  mood:
    response: "Current mood: {mood} | All systems operational"
  
  help:
    response: "Available commands: !ping, !status, !hello, !hype, !medlar, !mood, !moodnumbers, !addcopilot, !removecopilot, !listcopilots, !help"
  
  # Co-Pilot Management Commands (Pilot only)
  addcopilot:
    response: "Co-Pilot {target} registered! Welcome to the squad! 🚀"
    requires_pilot: true
  
  removecopilot:
    response: "Co-Pilot {target} unregistered. Thanks for flying with us! o7"
    requires_pilot: true
  
  listcopilots:
    response: "Active Co-Pilots: {copilots}"
  
  # ⭐ NEW: Stream management commands
  streaminfo:
    response: "Getting stream info..."
  
  title:
    response: "Current stream title"
  
  game:
    response: "Current game/category"
  
  # ⭐ NEW: Moderation commands (pilot/mod only)
  timeout:
    response: "User timed out"
    requires_pilot: true
  
  ban:
    response: "User banned"
    requires_pilot: true
  
  warn:
    response: "Warning issued"
    requires_pilot: true
  
  whitelist:
    response: "Domain whitelisted"
    requires_pilot: true
  
  modstats:
    response: "Moderation statistics"